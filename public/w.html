<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f5fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Our Memory</title>
    <style>
      :root {
        --bg: #f8f5fa;
        --accent: #7ca1d9;
        --muted: #8a8790;
        --placeholder: #e4e0ef;
        --ink: #1a1a1a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
      }
      a.card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        max-width: 360px;
        text-decoration: none;
        color: inherit;
        padding: 8px 6px;
      }
      .person {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 64px;
        flex-shrink: 0;
      }
      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--placeholder);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 18px;
        color: var(--accent);
        overflow: hidden;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .nick {
        margin-top: 4px;
        font-size: 9px;
        font-weight: 700;
        color: var(--muted);
        max-width: 64px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
      }
      .mid {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      .days {
        font-size: 26px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .label {
        margin-top: 2px;
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
      }
      .msg {
        text-align: center;
        padding: 16px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        max-width: 280px;
      }
      .msg.error {
        color: #c0392b;
      }
    </style>
  </head>
  <body>
    <div id="root" class="msg">Loading…</div>
    <script>
      (function () {
        var API = location.origin;
        var params = new URLSearchParams(location.search);
        var pathMatch = location.pathname.match(/\/w\/([^/?#]+)/i);
        var code = (params.get('code') || (pathMatch && pathMatch[1]) || '')
          .trim()
          .toUpperCase();
        var root = document.getElementById('root');

        function esc(s) {
          return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
        }

        function firstName(n) {
          return String(n || '')
            .trim()
            .split(/\s+/)[0];
        }

        function personHtml(user) {
          var nick = firstName(user && user.nickname);
          var url = (user && user.avatarUrl) || '';
          var letter = esc((nick || '?').charAt(0).toUpperCase());
          var avatar = url
            ? '<div class="avatar"><img src="' +
              esc(url) +
              '" alt="" /></div>'
            : '<div class="avatar">' + letter + '</div>';
          return (
            '<div class="person">' +
            avatar +
            '<div class="nick">' +
            esc(nick) +
            '</div></div>'
          );
        }

        if (!code || code === 'PASTE_INVITE_CODE_HERE') {
          root.className = 'msg';
          root.textContent = 'Add invite code to the URL: /w/YOUR_CODE';
          return;
        }

        fetch(API + '/api/widget?code=' + encodeURIComponent(code), {
          headers: { Accept: 'application/json' },
          cache: 'no-store',
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            if (!data || !data.ok) {
              throw new Error((data && data.error) || 'not_found');
            }
            var days = data.days != null ? data.days : 0;
            root.outerHTML =
              '<a class="card" href="' +
              API +
              '/" target="_blank" rel="noopener">' +
              personHtml(data.user1) +
              '<div class="mid"><div class="days">' +
              days +
              '</div><div class="label">days</div></div>' +
              personHtml(data.user2) +
              '</a>';
          })
          .catch(function (e) {
            root.className = 'msg error';
            root.textContent = String((e && e.message) || e);
          });
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our Memory</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
      }
      img {
        width: 100%;
        max-width: 420px;
        height: auto;
        display: block;
      }
      .msg {
        padding: 16px;
        font-size: 13px;
        font-weight: 600;
        color: #6b6570;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var pathMatch = location.pathname.match(/\/w\/([^/?#]+)/i);
        var code = (params.get('code') || (pathMatch && pathMatch[1]) || '')
          .trim()
          .toUpperCase();
        if (!code) {
          document.body.innerHTML =
            '<div class="msg">Add invite code: /w/YOUR_CODE</div>';
          return;
        }
        // Một ảnh PNG sẵn — WebsiteWidget không kẹt ở "Loading…"
        var img = new Image();
        img.alt = 'Our Memory';
        img.decoding = 'async';
        img.fetchPriority = 'high';
        img.src =
          location.origin +
          '/api/widget-png?code=' +
          encodeURIComponent(code);
        document.body.replaceChildren(img);
      })();
    </script>
  </body>
</html>
